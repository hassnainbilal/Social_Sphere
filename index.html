<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialSphere — CodeAlpha Task 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- AUTH SCREEN -->
<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1 class="brand">SocialSphere</h1>
    <p class="tagline">A small circle. Real conversations.</p>

    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login" type="button">Log in</button>
      <button class="tab-btn" data-tab="register" type="button">Sign up</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email
        <input type="email" id="login-email" required>
      </label>
      <label>Password
        <input type="password" id="login-password" required>
      </label>
      <p class="form-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label>Username
        <input type="text" id="register-username" required minlength="3">
      </label>
      <label>Email
        <input type="email" id="register-email" required>
      </label>
      <label>Password
        <input type="password" id="register-password" required minlength="6">
      </label>
      <label>Bio <span class="optional">(optional)</span>
        <input type="text" id="register-bio" placeholder="Say something about yourself">
      </label>
      <p class="form-error" id="register-error"></p>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
  </div>
</section>

<!-- MAIN APP -->
<div id="app" class="app hidden">
  <aside class="rail rail-left">
    <div class="brand-mark">SocialSphere</div>
    <nav class="nav">
      <button class="nav-link active" data-view="home" type="button">Home</button>
      <button class="nav-link" data-view="profile" type="button">Profile</button>
      <button class="nav-link" data-view="people" type="button">People</button>
    </nav>
    <div class="rail-footer">
      <div class="mini-profile" id="mini-profile"></div>
      <button class="btn btn-ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </aside>

  <main class="feed-col">
    <div id="view-home" class="view">
      <div class="composer">
        <div class="composer-avatar" id="composer-avatar"></div>
        <div class="composer-body">
          <textarea id="post-content" placeholder="What's on your mind?" rows="2"></textarea>
          <div class="composer-actions">
            <input type="text" id="post-image" placeholder="Image URL (optional)">
            <button class="btn btn-primary" id="post-submit" type="button">Post</button>
          </div>
        </div>
      </div>

      <div class="feed-tabs">
        <button class="feed-tab active" data-feed="all" type="button">Everyone</button>
        <button class="feed-tab" data-feed="following" type="button">Following</button>
      </div>

      <div id="posts-list" class="posts-list"></div>
    </div>

    <div id="view-profile" class="view hidden">
      <div class="profile-header" id="profile-header"></div>
      <div id="profile-posts" class="posts-list"></div>
    </div>

    <div id="view-people" class="view hidden">
      <h2 class="section-title">People</h2>
      <div id="people-list" class="people-list"></div>
    </div>
  </main>

  <aside class="rail rail-right">
    <h3 class="rail-heading">Who to follow</h3>
    <div id="suggestions" class="suggestions"></div>
  </aside>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
